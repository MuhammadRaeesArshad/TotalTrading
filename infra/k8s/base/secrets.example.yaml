# Template only — do not commit a filled-in copy. Generate and apply directly:
#
#   kubectl -n totaltrading create secret generic totaltrading-secrets \
#     --from-literal=JWT_ACCESS_SECRET=$(openssl rand -hex 32) \
#     --from-literal=JWT_REFRESH_SECRET=$(openssl rand -hex 32) \
#     --from-literal=MT5_CRED_KEY=$(openssl rand -hex 32)
#
# MT5_CRED_KEY encrypts stored broker passwords. Back it up somewhere you can
# actually find again — losing it means re-entering every account.
apiVersion: v1
kind: Secret
metadata:
  name: totaltrading-secrets
type: Opaque
stringData:
  JWT_ACCESS_SECRET: replace-me
  JWT_REFRESH_SECRET: replace-me
  MT5_CRED_KEY: replace-me
