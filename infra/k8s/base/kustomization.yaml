apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: totaltrading

commonLabels:
  app.kubernetes.io/part-of: totaltrading

resources:
  - namespace.yaml
  - config.yaml
  - mongo.yaml
  - redis.yaml
  - mt5-connector-endpoint.yaml
  - api-gateway.yaml
  - web.yaml
  - engines.yaml
  - backtest-engine.yaml
  - ingress.yaml
  # secrets.example.yaml is deliberately not listed — create the real Secret
  # out of band so nothing sensitive lives in git.
