# Single-replica StatefulSet. This is a local, one-operator tool — a replica
# set would buy availability nobody is asking for. If this ever runs somewhere
# it matters, swap in a managed Mongo or the Percona operator.
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels: { app.kubernetes.io/name: mongo }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mongo }
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mongo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          livenessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ['mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 10Gi
