# Health endpoints only until their build-order steps. They are here so the
# topology is visible and wiring them up later is a one-line image change.
apiVersion: v1
kind: Service
metadata:
  name: strategy-engine
spec:
  selector: { app.kubernetes.io/name: strategy-engine }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strategy-engine
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: strategy-engine }
  template:
    metadata:
      labels: { app.kubernetes.io/name: strategy-engine }
    spec:
      containers:
        - name: strategy-engine
          image: ghcr.io/muhammadraeesarshad/totaltrading-strategy-engine:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: totaltrading-config }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analysis
spec:
  selector: { app.kubernetes.io/name: ai-analysis }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analysis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ai-analysis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ai-analysis }
    spec:
      containers:
        - name: ai-analysis
          image: ghcr.io/muhammadraeesarshad/totaltrading-ai-analysis:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: totaltrading-config }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
