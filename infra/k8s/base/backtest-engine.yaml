# The bar cache is memory-mapped, so it needs a real PersistentVolume — not an
# emptyDir, which disappears with the pod and would mean re-importing years of
# history on every restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bar-cache
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backtest-engine
spec:
  selector: { app.kubernetes.io/name: backtest-engine }
  ports: [{ name: http, port: 8004, targetPort: 8004 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backtest-engine
spec:
  # One replica. The bar cache PVC is ReadWriteOnce, and runs are stateful in
  # process — scaling out means moving the queue to Redis first.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: backtest-engine }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backtest-engine }
    spec:
      containers:
        - name: backtest-engine
          image: ghcr.io/muhammadraeesarshad/totaltrading-backtest-engine:latest
          ports: [{ containerPort: 8004 }]
          env:
            - name: BAR_CACHE_DIR
              value: /var/lib/totaltrading/bars
            - name: RUST_LOG
              value: backtest_service=info
            # Imports log into MT5 directly rather than via the gateway.
            - name: MT5_CONNECTOR_URL
              value: http://mt5-connector:8001
          volumeMounts:
            - name: bars
              mountPath: /var/lib/totaltrading/bars
          resources:
            # A scan saturates whatever it is given. The request keeps it
            # schedulable; the limit stops one backtest starving the cluster.
            requests: { cpu: '1', memory: 512Mi }
            limits: { cpu: '4', memory: 4Gi }
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: 8004 }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
      volumes:
        - name: bars
          persistentVolumeClaim:
            claimName: bar-cache
