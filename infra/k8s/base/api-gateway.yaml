apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels: { app.kubernetes.io/name: api-gateway }
spec:
  selector: { app.kubernetes.io/name: api-gateway }
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: api-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/muhammadraeesarshad/totaltrading-api-gateway:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef: { name: totaltrading-config }
            - secretRef: { name: totaltrading-secrets }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          # Liveness is dependency-free so a Mongo blip doesn't restart the pod;
          # readiness is what pulls it out of the Service.
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/ready, port: 4000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
