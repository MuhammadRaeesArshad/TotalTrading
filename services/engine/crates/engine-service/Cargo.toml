[package]
name = "engine-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP wrapper around engine-core: job queue, progress, result persistence."

[[bin]]
name = "engine-service"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../engine-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Blocking HTTP, for pulling history out of mt5-connector. The importer runs on
# spawn_blocking anyway, so an async client would buy nothing and cost a lot of
# dependency surface.
#
# TLS is deliberately off. mt5-connector is reached over plain HTTP on the
# local machine or LAN, and the rustls stack pulls in a large dependency tree
# that also raises the MSRV past 1.75. If you ever put the connector behind
# https, add "tls" back to the feature list.
ureq = { version = "2.10", default-features = false, features = ["json"] }
