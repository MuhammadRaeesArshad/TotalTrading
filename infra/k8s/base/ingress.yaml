# Routes /api to the gateway and everything else to the static frontend, so
# both are same-origin and the browser never deals with CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: totaltrading
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - host: totaltrading.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 4000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
